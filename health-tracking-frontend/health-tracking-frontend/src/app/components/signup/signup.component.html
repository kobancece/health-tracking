<div class="signup-container">
  <mat-card class="signup-card">
    <mat-card-title class="title">Sign Up</mat-card-title>
    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error *ngIf="signupForm.get('firstName')?.hasError('required')">
            First name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
          <mat-error *ngIf="signupForm.get('lastName')?.hasError('required')">
            Last name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="signupForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" />
          <mat-error *ngIf="signupForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
          <mat-error *ngIf="signupForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="USER">User</mat-option>
            <mat-option value="DOCTOR">Doctor</mat-option>
          </mat-select>
        </mat-form-field>

        <div *ngIf="signupForm.get('role')?.value === 'DOCTOR'" class="specialization-fields">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Specialization</mat-label>
            <input matInput formControlName="specialization" />
            <mat-error *ngIf="signupForm.get('specialization')?.hasError('required')">
              Specialization is required
            </mat-error>
          </mat-form-field>
        </div>

        <button mat-raised-button color="accent" type="submit" class="submit-btn" [disabled]="!signupForm.valid">
          Sign Up
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
